name = "CYMA-1"
id_prefix = "FM-1_94"          # not in the taken list (900, 91N, 920, 93N, 97N, 99N)
release = "1.1.3"              # CYMA-1's own key (fm1-base ignores it): tools/run_all.sh --device passes it to
                               # build.py --release, so the package identity is FM-1_94010103 (v1.1.2: FM-1_94010102,
                               # v1.1.1: FM-1_94010101, v1.1: FM-1_94010100, v1.0: FM-1_9400). Built on the Team EG
                               # fork of fm1-base (platform/fm1-base-teg from tools/get_platform.sh, run_all.sh's
                               # default; FM1_BASE overrides it)
usb_manufacturer = "CYMA"
usb_product = "CYMA-1 FM-1"
o2 = ["src/*.c"]
words = "words.tsv"
ble = false
mirror = false
backup = true                  # the settings and user presets over USB (app.h APP_BACKUP_*)
usb_audio_in = true            # the FM-1 recordable over USB
usb_audio_out = false          # no computer audio through the FM-1: uac_play adds it after the limiter unclamped,
                               # so a loud host stream wrapped the 24-bit DAC word (and it frees 8 KB of RAM)
gen = ["tools/gen_fonts.py {gen}/cy_fonts.h"]
tagline = "a playable Chladni plate"
licence = "MPL-2.0"
credits = "Built on fm1-base (MPL-2.0). Barlow and Terminus fonts (SIL OFL 1.1)."
